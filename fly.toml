# fly.toml — Fly.io configuration for SnipURL
#
# Docs: https://fly.io/docs/reference/configuration/
#
# The app stores its SQLite database on a persistent volume mounted at /data,
# so links and click stats survive deploys and machine restarts.

app = "snipurl"
primary_region = "sgp"  # Singapore — nearest to the main users
schema = 1

[build]
# Built from the Dockerfile in the repo (node:22-slim, no native modules).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    limit = 250
    grace_period = "15s"

[[mounts]]
  source = "data"
  destination = "/data"

[env]
  DATABASE_PATH = "/data/links.db"
  NODE_ENV = "production"
