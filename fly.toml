# fly.toml app configuration file generated for snipurl on 2026-11-02T05:19:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'snipurl'
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/links.db'
  NODE_ENV = 'production'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
